services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudnova
      POSTGRES_USER: cloudnova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnova -d cloudnova"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cloudnova:${POSTGRES_PASSWORD}@postgres:5432/cloudnova
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  queue-worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cloudnova:${POSTGRES_PASSWORD}@postgres:5432/cloudnova
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    # No Docker socket or privileged mode. This queue worker cannot execute customer code.
  traefik:
    image: traefik:v3.2
    command: ["--configFile=/etc/traefik/traefik.yml", "--certificatesresolvers.cloudnova.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}"]
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?Set a scoped Cloudflare DNS token}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/var/lib/traefik
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  traefik_acme:
